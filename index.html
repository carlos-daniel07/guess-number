<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <title>Adivina el número</title>
</head>

<body>

  <main>
    <h1>Adivina el número</h1>
    <p class="subtitle">Elige un número entre 1 y 100</p>

    <p id="mensaje"></p>

    <div class="input-group">
      <input type="number" id="numeroEntrada" placeholder="Tu número..." min="1" max="100">
      <button onclick="chequearResultado()">Comprobar</button>
    </div>

    <div class="stats">
      Intentos: <span id="intento">0</span>
    </div>
  </main>

  <footer>
    Hecho con &hearts; por <a href="https://github.com/carlos-daniel07" target="_blank" rel="noopener noreferrer">Carlos Arteaga</a>
  </footer>

  <script src="script.js"></script>
</body>

</html>
